[profile]
active = "air-16"

[profile.air-16]
concurrency    = 1
whisper_model  = "mlx-community/whisper-large-v3-turbo-q4"
demucs_segment = 7
demucs_model   = "htdemucs"
demucs_device  = "mps"
encoder        = "h264_videotoolbox"
video_bitrate  = "8M"
prefer_h264    = false   # bật trên máy không có hardware AV1 decode (Intel, M1, M2)

[profile.studio-24]
concurrency    = 2
whisper_model  = "mlx-community/whisper-large-v3-turbo"
demucs_segment = 12
demucs_model   = "htdemucs"
demucs_device  = "mps"
encoder        = "h264_videotoolbox"
video_bitrate  = "12M"
prefer_h264    = false

[audio]
mode     = "separate"
bgm_gain = 0.35

[transform]
hflip = false
zoom  = 1.0
speed = 1.0

[subtitle]
font     = "Be Vietnam Pro"
size     = 64
outline  = 4
position = "bottom"

[review]
auto_approve_b = false

[tts]
engine     = "capcut"          # "capcut" | "stub"
voice      = "BV074_streaming" # Cô Gái Hoạt Ngôn — xem Voice.json của CapCut
capcut_dir = "/Applications/_QuangLB/Workspace/Agent/capcut-tts-api"

[asr]
engine = "whisper"             # "whisper" | "capcut"

# provider = "ollama" chạy model local: không hạn mức, không API key, không cần
# mạng. Cần `ollama serve` đang chạy và đã `ollama pull <model>`.
# Đổi lại chậm hơn và chất lượng tiếng Việt phụ thuộc model — đo trước khi tin.
[llm]
provider  = "gemini"            # "gemini" | "ollama" | "cassette"
model     = "gemini-3.6-flash"
base_url  = "http://localhost:11434"   # chỉ dùng cho ollama
timeout_s = 600.0                      # chỉ dùng cho ollama

# YouTube bắt giải "JS challenge" mới trả link tải. yt-dlp cần một JS runtime
# (deno, node, hoặc bun) và script giải challenge tải từ GitHub. Thiếu chúng thì
# MỌI video YouTube đều báo "This video is not available".
# js_runtime rỗng = tự dò. remote_components rỗng = không chạy mã tải từ GitHub,
# đổi lại YouTube hỏng.
[fetch]
js_runtime        = ""
remote_components = "ejs:github"

# Quét nguồn cho tab "YouTube / TikTok / Douyin" trong Web UI và lệnh `reup discover`.
# `query`: hashtag, @tên người dùng, hoặc nguyên một URL trang nguồn.
# TikTok và Douyin chặn khách vãng lai — đặt cookies_from_browser ("chrome",
# "safari", "firefox"…) hoặc cookie_file (định dạng Netscape) thì mới quét được.
# Douyin còn cần IP ra được Trung Quốc (spec R1).
# youtube.query: chữ trần = tìm kiếm, "#tag" = hashtag, "@tên" = kênh, hoặc URL.
[discover.youtube]
query = "#shorts"
limit = 12

[discover.tiktok]
query = "xuhuong"
limit = 12
cookies_from_browser = ""

[discover.douyin]
query = ""
limit = 12
cookies_from_browser = ""
