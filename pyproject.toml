[project]
name = "reup"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp>=2024.1.1",
    "mlx-whisper>=0.4.0",
    "google-genai>=1.0.0",
    "demucs>=4.0.0",
    "ocrmac>=1.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
reup = "reup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
