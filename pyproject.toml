[project]
name = "reup"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["yt-dlp>=2024.1.1", "mlx-whisper>=0.4.0", "google-genai>=1.0.0"]

[project.scripts]
reup = "reup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
